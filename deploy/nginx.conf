# =============================================================================
# Alternativa a Caddy per chi ha gia' nginx. Il certificato va gestito a parte
# (certbot --nginx -d cruscotto.esempio.it) perche' nginx, a differenza di
# Caddy, non lo ottiene da solo.
#
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/cruscotto
#   sudo ln -s /etc/nginx/sites-available/cruscotto /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
# =============================================================================

upstream cruscotto {
    server 127.0.0.1:8080;
    keepalive 32;
}

server {
    listen 80;
    server_name cruscotto.esempio.it;
    # Tutto il traffico in chiaro viene rediretto: l'app gestisce credenziali
    # e dati personali di minorenni, l'HTTP semplice non e' un'opzione.
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name cruscotto.esempio.it;

    ssl_certificate     /etc/letsencrypt/live/cruscotto.esempio.it/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cruscotto.esempio.it/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # I video possono essere grandi; le risposte AI arrivano in streaming.
    client_max_body_size 512m;
    proxy_read_timeout 120s;
    proxy_buffering off;

    gzip on;
    gzip_types application/json application/javascript text/css image/svg+xml;
    gzip_min_length 1024;

    # Immagini del listato: nome = hash del contenuto, quindi immutabili.
    location /media/ {
        proxy_pass http://cruscotto;
        proxy_set_header Host $host;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /sw.js {
        proxy_pass http://cruscotto;
        add_header Cache-Control "no-cache";
    }

    location /api/ {
        proxy_pass http://cruscotto;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "private, no-store" always;
    }

    location / {
        proxy_pass http://cruscotto;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
    }
}
